      <path d="M1 11C7 11 7 8 7 8V5H0V4H9C9 4 12 4 12 -1C12 -6 9 -6 9 -6H7V-3C7 0 4 0 4 0H-3C-5 0 -5 2 -5 2V8C-5 8 -5 11 1 11Z"
