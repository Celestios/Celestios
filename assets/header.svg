    <circle cx="261" cy="436" r="4.5" stroke="#7658FF"/>
    <circle cx="296" cy="84" r="4.5"/>
    <circle cx="338" cy="114" r="4.5"/>
    <circle cx="350" cy="142" r="4.5"/>
    <circle cx="325" cy="163" r="4.5"/>
    <circle cx="364" cy="168" r="4.5"/>
