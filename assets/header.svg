    <text x="248" y="116">/ .-' &gt; +.:|</text>
    <text x="248" y="128">/ :=.-==-: .|</text>
    <text x="248" y="140">/ .-'  _.-: :|</text>
    <text x="248" y="152">//=-._=-.   :|</text>
    <text x="248" y="164">|:._==- =-   |</text>
    <text x="248" y="176">||-==' .-=: . |</text>
    <text x="248" y="188">|:  .-==-. :  |</text>
    <text x="248" y="200">|/._=-' _=- .  |</text>
    <text x="248" y="212">||=-. .-=.:    |</text>
    <text x="248" y="224">|| _.==-. =-._ |</text>
    <text x="248" y="236">||.-==_ .=-.   |</text>
    <text x="248" y="248">|:'-===-.  :=- |</text>
    <text x="248" y="260">||-. _==- =-.  |</text>
    <text x="248" y="272">|\ ==-. '-=._  |</text>
    <text x="248" y="284">|:._ '==-. :  |</text>
    <text x="248" y="296">\|==-._ ==-.  |</text>
    <text x="248" y="308">\:._ .-==-.   |</text>
    <text x="248" y="320">\ -===-' _=. |</text>
    <text x="248" y="332">\. _.-===- : |</text>
    <text x="248" y="344">\ ===-._:=.  |</text>
    <text x="248" y="356">\:._  ===-. |</text>
    <text x="248" y="368">\ -= .==-' /|</text>
    <text x="248" y="380">\_ . .-==:|</text>
    <text x="248" y="392">\ ===-. |</text>
    <text x="248" y="404">'-====-' </text>
  </g>

  <!-- BRAIN CENTER FISSURE: SEGMENTED ASCII PIPE COLUMNS -->
