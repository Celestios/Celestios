  <!-- BACKGROUND -->
  <rect width="1600" height="500" fill="#040B23"/>

  <!-- ANGULAR OUTER FRAME AND CORNER ACCENTS -->
  <path d="M38 14H1562L1586 38V462L1562 486H38L14 462V38Z"
